defaults:
  - base
  - _self_

training:
  batch_size: 2048
  dropout: 0.4
  cls_dropout: 0.4
  gene_mask: 0.4
  patch_mask: 0.4

teacher:
  training:
    epochs: 100
    warm_up_epoch: 30
    optimizer:
      lr: 4e-4
      weight_decay: 4e-4


student:
  training:
    epochs: 100
    warm_up_epoch: 0
    optimizer:
      lr: 4e-4
      weight_decay: 4e-4

    dropout: 0.2
    cls_dropout: 0.2
    patch_mask: 0.2
